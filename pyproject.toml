[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forest-place-recognition"
version = "0.1.0"
description = "Season-invariant visual place recognition for forest environments using FinnForest dataset"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "torch",
    "torchvision",
    "click",
    "matplotlib",
    "opencv-python",
    "scikit-learn",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "Pillow",
]

[project.scripts]
forest-pr = "forest_place_recognition.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
